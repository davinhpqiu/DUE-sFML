seed: 0
eval_only: true   # eval-only: figures were regenerated from saved models (no retraining needed)

dtype: single

# Ornstein-Uhlenbeck (Chen & Xiu 2024, §5.1.1):
#   dx = theta*(mu-x) dt + sigma dW,   theta=1, mu=1.2, sigma=0.3,  dt=0.01
# IC: U(0, 0.25).  Test: x0=1.5, T=4.

data:
    problem_dim: 1
    memory: 0
    normalization: "none"       # paper does not normalize. options: "none" | "minmax" | "yeojohnson"

network:
    depth: 3                    # paper: 3x20 for generator and D_theta
    width: 20
    critic_depth: 3             # separate critic size (paper uses same 3x20 for all nets)
    critic_width: 20           # options: any int; 4x128 needed to witness increment variance
    activation: "gelu"
    latent_dim: 1               # noise dim Z. Paper §4.3: "the dimension of z, n_s>=1, is a choice made by USER" — NOT specified. Z=1 is our choice.
    condition_on_state: true    # generator: (x,z) -> dy;  critic: (x0, y1:L) -> score
    det_arch: "resnet"    # options: "resnet" | "gated_resnet"
                                # gated_resnet: D(x) = x + Affine(x) + sigmoid(a)*MLP(x), zero-init.
                                # paper uses plain resnet

training:
    device: "cpu"
    valid: 0
    epochs: 5000  # paper trains D_theta multi-step (2D case: 5000 ep)
    batch_size: 256
    optimizer: "adam"
    scheduler: "cosine"
    learning_rate: 0.001
    verbose: 50
    loss: "mse"
    use_oracle_det: false      # true = replace D_theta with exact OU map (ablation only)
    phase1_single_step: false   # false = multi-step rollout loss (paper eq. 4.11)
    save_path: "./det_model"

gan:
    epochs: 100000                # paper: 100k; centering + strong critic converges in ~1k
    batch_size: 1000            # paper: 1000
    n_critic: 5                 # paper: n_ct=5
    gp_lambda: 10               # paper: 10
    reuse_fake: true            # paper Alg 4.1: ONE fake rollout per batch reused by critic (L13) + generator (L18). false = regenerate w/ fresh z (cheaper memory, not literal)
    gp_mode: "pair"             # "pair" = paper Alg 4.1 L12 (grad wrt x0 AND y); "y_only" = x0 as pure condition (flat b(x), Part 28)
    # increment_scale: rescale the increments the critic + GP see so a small per-state variance
    # mismatch clears the GP/noise floor (Part 22 — fixed the OU diffusion tilt + std overshoot).
    # Physics unchanged: generator, MMD, stats and prediction stay in physical units. Choices:
    #    1      -> off (raw increments, original behaviour)
    #    10     -> professor's value; resolved OU (best result to date, best ckpt ~ep500)
    #    5      -> gentler; try if 10 slightly under-shoots the std
    #    "auto" -> data-derived 1/std(dx): scales increments to ~unit std (~33 for OU), equation-agnostic
    increment_scale: 1
    optimizer: "adam"           # "adam" (WGAN-GP betas) or "muon" (critic on 2D weights; needs torch>=2.13; Muon wants a LARGER lr)
    learning_rate: 0.00005      # LR must match "optimizer" above:  adam -> 5e-5 (paper)  |  muon -> ~1e-3 (Muon needs a much larger step). Cosine-decays to lr_min.
    lr_decay: false              # cosine decay lr -> lr_min over training (paper uses fixed lr)
    lr_min: 0.00001
    adam_beta1: 0.5             # paper: 0.5
    adam_beta2: 0.999           # paper: 0.999
    verbose: 10
    checkpoint_interval: 100    # save checkpoint every N epochs; best selected by score below
    selection_std_weight: 1.0   # score = std_rel_err*w_std + wasserstein_gap*w_wgap
    selection_wgap_weight: 1.0  #       + gradient_penalty*w_gp + mean_abs_err*w_mean
    selection_gp_weight: 1.0
    selection_mean_weight: 1.0  # include per-step mean error in checkpoint selection (was 0 -> picked bad-mean checkpoints)
    mmd_lambda: 0.0             # CR-GAN MMD term on generator loss (not in paper). 0.0 to disable
    center_generator: false     # hard-center S: S_c(x,z0) = S(x,z0) - mean_k S(x,zk)
                                # forces generator zero-mean per state; not in paper
    center_K: 16                # Monte Carlo draws for per-state mean in centering
    single_step_critic: false    # critic sees (x_t, Δx_t) pairs instead of L-step sequences
                                # gives direct signal on per-step variance, no gradient attenuation
    eval_model: "both"          # eval both "best" (selection) and "final" (paper) models -> gan_model/eval_best, eval_final
    save_path: "./gan_model"
