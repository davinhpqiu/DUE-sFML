# ACTIVATION EXPERIMENT: identical to config.yaml except activation gelu -> tanh.
# Hypothesis: the escape at ~56k is an EXTRAPOLATION instability in the noise amplitude.
#   GELU is unbounded and asymptotically linear  -> sigma(x) grows outside the data.
#   tanh saturates                               -> sigma(x) stays bounded, no runaway.
# Run to 60k (just past the escape), then sweep checkpoints as before.
# Run:  python OU.py config_tanh.yaml   then   python sweep_checkpoints.py config_tanh.yaml

seed: 0
eval_only: false
dtype: single
data:
  problem_dim: 1
  memory: 0
  normalization: none
network:
  depth: 3
  width: 20
  critic_depth: 3
  critic_width: 20
  activation: tanh
  latent_dim: 1
  condition_on_state: true
  det_arch: resnet
training:
  device: cpu
  valid: 0
  epochs: 5000
  batch_size: 256
  optimizer: adam
  scheduler: cosine
  learning_rate: 0.001
  verbose: 50
  loss: mse
  use_oracle_det: false
  phase1_single_step: false
  save_path: ./det_model_tanh
gan:
  epochs: 60000
  batch_size: 1000
  n_critic: 5
  gp_lambda: 10
  reuse_fake: true
  gp_mode: pair
  increment_scale: 1
  optimizer: adam
  learning_rate: 5.0e-05
  lr_decay: false
  lr_min: 1.0e-05
  adam_beta1: 0.5
  adam_beta2: 0.999
  verbose: 10
  checkpoint_interval: 100
  selection_std_weight: 1.0
  selection_wgap_weight: 1.0
  selection_gp_weight: 1.0
  selection_mean_weight: 1.0
  mmd_lambda: 0.0
  center_generator: false
  center_K: 16
  single_step_critic: false
  eval_model: both
  save_path: ./gan_model_tanh
