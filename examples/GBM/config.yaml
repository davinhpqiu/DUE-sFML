seed: 0

dtype: single

# Geometric Brownian Motion:  dx = mu x dt + sigma x dW,  mu=2, sigma=1
# The full OU pipeline + Yeo-Johnson normalization (the ONLY change needed for GBM:
# min-max crushes the exponential range; YJ discovers a log-like transform from data).

data:
    problem_dim: 1
    memory: 0
    normalization: "yeojohnson"   # Phase-2 coordinate (needs YJ: raw Phase-2 fails — negative traj, constant diffusion)
    # phase1_normalization: "none"  # DECOUPLE (OFF): raw Phase-1 wrapped into YJ. Negative result — mean +68%, std ~7x (Part 16). Uncomment to re-enable.

network:
    depth: 3
    width: 20
    critic_depth: 4
    critic_width: 128
    activation: "gelu"
    latent_dim: 1
    condition_on_state: true
    det_arch: "gated_resnet"   # Phase-1 D_theta architecture: "resnet" or "gated_resnet"

training:   # Phase 1 — deterministic ResNet D_theta (learned, multi-step)
    device: "cpu"
    valid: 0
    epochs: 250
    batch_size: 256
    optimizer: "adam"
    scheduler: "cosine"
    learning_rate: 0.001
    verbose: 50
    loss: "mse"
    use_oracle_det: false
    phase1_single_step: false
    save_path: "./det_model"

gan:                # Phase 2 — WGAN-GP (full working pipeline)
    epochs: 1000
    batch_size: 1000
    n_critic: 5
    gp_lambda: 10
    learning_rate: 0.00005
    lr_decay: true
    lr_min: 0.00001
    adam_beta1: 0.5
    adam_beta2: 0.999
    verbose: 10
    checkpoint_interval: 100
    selection_std_weight: 1.0
    selection_wgap_weight: 1.0
    selection_gp_weight: 1.0
    selection_mean_weight: 0.0
    mmd_lambda: 1.0
    center_generator: true
    center_K: 16
    jensen_correction: false   # Jensen center-correction: shift D̃(u) to pin physical mean (Part 17)
    save_path: "./gan_model"
